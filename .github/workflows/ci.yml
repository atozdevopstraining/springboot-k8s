name: CI - Spring Boot

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "0 2 * * *"
  push:
    branches:
      - "*"
    #branches-ignore:
    #  - experimental
    tags:
      - "v*"
  #pull_request:
  #  types:
  #    - opened
  #    - reopened
  #    - synchronize
  #  branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean install

    - name: Run tests
      run: mvn test
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar

  docker:
    name: Docker Build with Kaniko
    runs-on: ubuntu-latest
    needs: build
    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Download JAR artifact
          uses: actions/download-artifact@v4
          with:
            name: spring-boot-app
            path: target

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Set image tags
          id: set-tags
          env:
            # Use PR head ref when available, otherwise fallback to ref_name
            GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          run: |
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              TAG="atozdevopstraining/spring-boot-app:latest"
            else
              DATE=$(date -u +"%Y%m%d%H%M%S")
              BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
              TAG="atozdevopstraining/spring-boot-app:${BRANCH}-${DATE}"
            fi
            echo "Computed tag: ${TAG}"
            echo "tags=${TAG}" >> $GITHUB_OUTPUT

        - name: Debug computed tag
          run: |
            echo "set-tags output: '${{ steps.set-tags.outputs.tags }}'"
            echo "GITHUB_REF: $GITHUB_REF"
            echo "github.head_ref: ${{ github.head_ref }}"
            echo "github.ref_name: ${{ github.ref_name }}"

        - name: Build and Push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            # tags are set from the previous step output
            tags: ${{ steps.set-tags.outputs.tags }}
